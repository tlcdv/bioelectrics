name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU PyTorch and the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
      - name: Run tests with coverage
        run: python -m pytest --cov=bioelectrics --cov-report=term-missing -q

      # The notebooks are executed, not just parsed, so a tutorial that no longer
      # runs fails the build. One job is enough; the physics is covered above.
      - name: Execute the tutorial notebooks
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          python -m pip install -e ".[notebooks]"
          python -m pytest --nbmake notebooks/ -q
