name: publish

# Runs only when a GitHub release is published, so nothing is uploaded by a
# push. Publishing uses PyPI trusted publishing: no token is stored in this
# repository or in its secrets. It requires a pending publisher configured once
# on PyPI for owner tlcdv, repository bioelectrics, workflow publish.yml,
# environment pypi.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the distribution
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      # The version in the tag and the version in the package must agree, or a
      # release ships something other than what its tag claims.
      - name: Check the tag matches the package version
        if: github.event_name == 'release'
        run: |
          PKG=$(ls dist/*.tar.gz | sed -E 's/.*bioelectrics-(.*)\.tar\.gz/\1/')
          TAG=${GITHUB_REF_NAME#v}
          echo "package $PKG, tag $TAG"
          test "$PKG" = "$TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/bioelectrics
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
